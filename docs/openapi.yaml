  # ════════════════════════════════════════════════════════════════
  # TASKS — /api/v1/tasks
  # ════════════════════════════════════════════════════════════════
  /tasks:
    get:
      summary: List tasks
      operationId: listTasks
      tags: [Tasks]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: outlet_id
          in: query
          schema:
            type: string
            format: uuid
        - name: assignee_user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, done, rejected, verified, cancelled]
        - name: due_from
          in: query
          schema:
            type: string
            format: date
            description: YYYY-MM-DD
        - name: due_to
          in: query
          schema:
            type: string
            format: date
            description: YYYY-MM-DD
        - name: overdue
          in: query
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Daftar tasks (paginated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "422":
          description: Input tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create task
      operationId: createTask
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outlet_id, assignee_user_id, title]
              properties:
                outlet_id:
                  type: string
                  format: uuid
                assignee_user_id:
                  type: string
                  format: uuid
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: [string, "null"]
                  maxLength: 2000
                due_at:
                  type: [string, "null"]
                  description: ISO 8601 datetime atau YYYY-MM-DD (dikonversi ke WIB)
      responses:
        "201":
          description: Task berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/Task"
        "422":
          description: Input tidak valid / self-assignment dilarang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tasks/{id}:
    get:
      summary: Get task detail with evidence
      operationId: getTaskDetail
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Task detail termasuk evidence
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Task"
                      - type: object
                        properties:
                          evidence:
                            type: array
                            items:
                              $ref: "#/components/schemas/TaskEvidence"
        "404":
          description: Task tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Update task (edit saat open)
      operationId: updateTask
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: [string, "null"]
                  maxLength: 2000
                due_at:
                  type: [string, "null"]
                  description: ISO 8601 datetime
      responses:
        "200":
          description: Task berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/Task"
        "404":
          description: Task tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Task hanya bisa diedit saat open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Input tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tasks/{id}/start:
    post:
      summary: Start task (ubah status ke in_progress)
      operationId: startTask
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Task berhasil di-start
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/Task"
        "403":
          description: Hanya assignee yang bisa start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Transisi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tasks/{id}/done:
    post:
      summary: Mark task as done
      operationId: doneTask
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Task berhasil diselesaikan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/Task"
        "403":
          description: Hanya assignee yang bisa menyelesaikan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Transisi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tasks/{id}/verify:
    post:
      summary: Verify task
      operationId: verifyTask
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Task berhasil diverifikasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/Task"
        "403":
          description: SoD — assignee tidak boleh verify task sendiri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Transisi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tasks/{id}/reject:
    post:
      summary: Reject task (kembali ke assignee)
      operationId: rejectTask
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "200":
          description: Task berhasil direject
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/Task"
        "403":
          description: SoD — assignee tidak boleh reject sendiri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Transisi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Reason wajib diisi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tasks/{id}/cancel:
    post:
      summary: Cancel task
      operationId: cancelTask
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Task berhasil di-cancel
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/Task"
        "403":
          description: Hanya assigner yang bisa cancel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Transisi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Tidak terautentikasi — token tidak ada atau tidak valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Akses ditolak — tidak memiliki permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    # ── Envelope ───────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
    PaginationMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    ScopeType:
      type: string
      enum: [global, company, brand, outlet, department, own, assigned, audit_view]
    # ── Auth ───────────────────────────────────────────────────────
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        status:
          type: string
        first_login_required:
          type: boolean
        is_freelance:
          type: boolean
        last_login_at:
          type: [string, "null"]
          format: date-time
    # ── Core ───────────────────────────────────────────────────────
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    Brand:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    Outlet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        brand_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        outlet_name:
          type: string
        outlet_code:
          type: string
        outlet_type:
          type: string
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
        brand_id:
          type: string
          format: uuid
        outlet_id:
          type: string
          format: uuid
        name:
          type: string
    # ── RBAC ──────────────────────────────────────────────────────
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: [string, "null"]
        description:
          type: string
        default_scope_type:
          $ref: "#/components/schemas/ScopeType"
        is_system:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: [string, "null"]
          format: date-time
    RoleWithPermissions:
      allOf:
        - $ref: "#/components/schemas/Role"
        - type: object
          properties:
            permissions:
              type: array
              items:
                type: string
    Permission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        module:
          type: string
        action:
          type: [string, "null"]
        description:
          type: string
        created_at:
          type: string
          format: date-time
    UserRoleAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
        role_code:
          type: string
        scope_type:
          $ref: "#/components/schemas/ScopeType"
        scope_id:
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: [string, "null"]
          format: date-time
    AccessOverride:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        permission_code:
          type: string
        effect:
          type: string
          enum: [grant, deny]
        scope_type:
          $ref: "#/components/schemas/ScopeType"
        scope_id:
          type: [string, "null"]
          format: uuid
        reason:
          type: [string, "null"]
        expires_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: [string, "null"]
          format: date-time
    # ── Users ──────────────────────────────────────────────────────
    PublicUserDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: [string, "null"]
        phone:
          type: string
        status:
          type: string
          enum: [invited, active, suspended, archived]
        first_login_required:
          type: boolean
        is_freelance:
          type: boolean
        freelance_expires_at:
          type: [string, "null"]
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: "#/components/schemas/PublicUserRole"
    PublicUserRole:
      type: object
      properties:
        assignment_id:
          type: string
          format: uuid
        role_code:
          type: string
        scope_type:
          $ref: "#/components/schemas/ScopeType"
        scope_id:
