openapi: 3.1.0
info:
  title: EGG OS API
  description: |
    EGG OS — sistem ERP internal berbasis web.
    API endpoint untuk modul Auth, Core, RBAC, Users, Inventory, Reports, Evidence, Dashboard, Audit, dan Task.
  version: "1.0.0"
servers:
  - url: http://localhost:8787/api/v1
    description: Development server
  - url: https://api.eggos.id/api/v1
    description: Production server
paths:
  # ════════════════════════════════════════════════════════════════
  # AUTH — /api/v1/auth
  # ════════════════════════════════════════════════════════════════
  /auth/login:
    post:
      summary: Login dengan email dan password
      operationId: authLogin
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              example:
                email: user@example.com
                password: myPassword123
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      refresh_token:
                        type: string
                      token_type:
                        type: string
                        enum: [Bearer]
                      expires_in:
                        type: integer
                      user:
                        $ref: "#/components/schemas/UserProfile"
        "401":
          description: Email atau password tidak sesuai / akun tidak aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Input tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Terlalu banyak percobaan login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/refresh:
    post:
      summary: Refresh token
      operationId: authRefresh
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Token berhasil di-refresh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      refresh_token:
                        type: string
                      token_type:
                        type: string
                        enum: [Bearer]
                      expires_in:
                        type: integer
        "401":
          description: Token tidak valid / kedaluwarsa / reuse terdeteksi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Input tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      summary: Logout (revoke refresh token)
      operationId: authLogout
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Opsional. Jika tidak diberikan, semua session direvoke.
      responses:
        "200":
          description: Logout berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
        "422":
          description: Input tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      summary: Get user profile saat ini
      operationId: authMe
      tags: [Auth]
      responses:
        "200":
          description: Profile user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/UserProfile"
        "401":
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me/permissions:
    get:
      summary: Get permissions user saat ini
      operationId: authMePermissions
      tags: [Auth]
      responses:
        "200":
          description: Daftar roles, scopes, dan permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      roles:
                        type: array
                        items:
                          type: string
                          description: Role codes
                      scopes:
                        type: array
                        items:
                          type: object
                          properties:
                            scope_type:
                              $ref: "#/components/schemas/ScopeType"
                            scope_id:
                              type: [string, "null"]
                              format: uuid
                      permissions:
                        type: array
                        items:
                          type: string
                          description: Permission code (module.action)
        "401":
          description: Tidak terautentikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/set-password:
    post:
      summary: Set password pertama kali (via token undangan)
      operationId: authSetPassword
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                  minLength: 10
                new_password:
                  type: string
                  description: Minimal 8 karakter, harus mengandung huruf dan angka
      responses:
        "200":
          description: Password berhasil di-set
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
        "401":
          description: Token tidak valid / kedaluwarsa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Token sudah digunakan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Input tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/request-password-reset:
    post:
      summary: Request reset password (mengirim email)
      operationId: authRequestPasswordReset
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Selalu return 200 (anti-enumeration)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
        "422":
          description: Input tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/reset-password:
    post:
      summary: Reset password dengan token
      operationId: authResetPassword
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                  minLength: 10
                new_password:
                  type: string
                  description: Minimal 8 karakter, harus mengandung huruf dan angka
      responses:
        "200":
          description: Password berhasil di-reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
        "401":
          description: Token tidak valid / kedaluwarsa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Token sudah digunakan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Input tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/change-password:
    post:
      summary: Ganti password (saat sudah login)
      operationId: authChangePassword
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  description: Minimal 8 karakter, harus mengandung huruf dan angka
      responses:
        "200":
          description: Password berhasil diganti
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
        "401":
          description: Password saat ini tidak sesuai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Input tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  # ════════════════════════════════════════════════════════════════
  # CORE — /api/v1
  # ════════════════════════════════════════════════════════════════
  /companies:
    get:
      summary: List companies
      operationId: listCompanies
      tags: [Core]
      responses:
        "200":
          description: Daftar companies
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Company"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /brands:
    get:
      summary: List brands
      operationId: listBrands
      tags: [Core]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        "200":
          description: Daftar brands
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Brand"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /outlets:
    get:
      summary: List outlets
      operationId: listOutlets
      tags: [Core]
      parameters:
        - name: brand_id
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        "200":
          description: Daftar outlets
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Outlet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /departments:
    get:
      summary: List departments
      operationId: listDepartments
      tags: [Core]
      parameters:
        - name: brand_id
          in: query
          schema:
            type: string
            format: uuid
        - name: outlet_id
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        "200":
          description: Daftar departments
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Department"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  # ════════════════════════════════════════════════════════════════
  # RBAC — /api/v1/rbac
  # ════════════════════════════════════════════════════════════════
  /rbac/roles:
    get:
      summary: List roles
      operationId: listRoles
      tags: [RBAC]
      responses:
        "200":
          description: Daftar roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create role
      operationId: createRole
      tags: [RBAC]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, default_scope_type]
              properties:
                code:
                  type: string
                  pattern: "^[A-Z][A-Z0-9_]+$"
                name:
                  type: string
                description:
                  type: string
                default_scope_type:
                  $ref: "#/components/schemas/ScopeType"
      responses:
        "201":
          description: Role berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/Role"
        "409":
          description: Duplikat code role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Input tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rbac/roles/{id}:
    get:
      summary: Get role detail
      operationId: getRole
      tags: [RBAC]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Role detail termasuk permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/RoleWithPermissions"
        "404":
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Update role (partial)
      operationId: updateRole
      tags: [RBAC]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: [string, "null"]
                description:
                  type: string
                default_scope_type:
                  $ref: "#/components/schemas/ScopeType"
      responses:
        "200":
          description: Role berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/Role"
        "403":
          description: System role tidak bisa diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Input tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete role (soft-delete)
      operationId: deleteRole
      tags: [RBAC]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Role berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/Role"
        "403":
          description: System role tidak bisa dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rbac/roles/{id}/permissions:
    put:
      summary: Set permissions untuk role (replace all)
      operationId: setRolePermissions
      tags: [RBAC]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_codes]
              properties:
                permission_codes:
                  type: array
                  items:
                    type: string
                    description: Permission code (module.action)
                  minItems: 1
      responses:
        "200":
          description: Permissions berhasil di-set
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/RoleWithPermissions"
        "403":
          description: System role tidak bisa diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Input tidak valid atau permission tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rbac/permissions:
    get:
      summary: List all permissions
      operationId: listPermissions
      tags: [RBAC]
      responses:
        "200":
          description: Daftar semua permission codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Permission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /rbac/users/{userId}/roles:
    get:
      summary: List role assignments untuk user
      operationId: listUserRoles
      tags: [RBAC]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Daftar role assignments user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserRoleAssignment"
        "404":
          description: User tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Assign role ke user
      operationId: assignUserRole
      tags: [RBAC]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id, scope_type, scope_id]
              properties:
                role_id:
                  type: string
                  format: uuid
                scope_type:
                  $ref: "#/components/schemas/ScopeType"
                scope_id:
                  type: [string, "null"]
                  format: uuid
      responses:
        "201":
          description: Role berhasil di-assign
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/UserRoleAssignment"
        "404":
          description: User atau role tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplikat assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Input tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rbac/users/{userId}/roles/{assignmentId}:
    delete:
      summary: Revoke role dari user
      operationId: revokeUserRole
      tags: [RBAC]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Role berhasil di-revoke
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/UserRoleAssignment"
        "404":
          description: User atau assignment tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rbac/users/{userId}/overrides:
    post:
      summary: Create atau upsert access override untuk user
      operationId: createAccessOverride
      tags: [RBAC]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_code, effect]
              properties:
                permission_code:
                  type: string
                  description: Permission code (module.action)
                effect:
                  type: string
                  enum: [grant, deny]
                scope_type:
                  $ref: "#/components/schemas/ScopeType"
                  default: company
                scope_id:
                  type: [string, "null"]
                  format: uuid
                  default: null
                reason:
                  type: string
                expires_at:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Override berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/AccessOverride"
        "404":
          description: User atau permission tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Input tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rbac/users/{userId}/overrides/{id}:
    delete:
      summary: Hapus access override
      operationId: deleteAccessOverride
      tags: [RBAC]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Override berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/AccessOverride"
        "404":
          description: Override tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
