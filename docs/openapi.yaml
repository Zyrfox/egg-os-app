          description: Evidence tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Evidence belum confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /evidence/{id}:
    delete:
      summary: Delete evidence (soft-delete)
      operationId: deleteEvidence
      tags: [Evidence]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Evidence berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
        "404":
          description: Evidence tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Record induk sudah final
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
